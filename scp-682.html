<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCP-682 - Dossier SCP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(
                    circle at center,
                    rgba(90, 0, 0, 0.45),
                    #060202 70%
                );
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
            color: white;
            text-shadow: 0 0 15px #ff3b3b;
        }

        .subtitle {
            font-size: 18px;
            color: #ffaaaa;
            margin-bottom: 45px;
        }

        .content-box {
            max-width: 800px;
            margin: 0 auto 40px auto;
            padding: 35px;
            border: 2px solid #ff3b3b;
            border-radius: 15px;
            background: rgba(40, 0, 0, 0.8);
            text-align: left;
            box-shadow: 0 0 12px rgba(255, 59, 59, 0.25);
        }

        .content-box p {
            color: #cccccc;
            line-height: 1.6;
        }

        .content-box .field-label {
            font-weight: bold;
            color: #ffffff;
            margin-top: 20px;
            margin-bottom: 6px;
        }

        .content-box .field-label:first-child {
            margin-top: 0;
        }

        .content-box .field-value {
            margin-bottom: 6px;
        }

        .back {
            display: inline-block;
            margin-top: 10px;
            margin-right: 20px;
            padding: 15px 28px;
            border-radius: 8px;
            background: #ff3b3b;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back:hover {
            background: #ff7a7a;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>SCP-682</h1>

    <p class="subtitle">Dossier en cours de rédaction</p>

    <div class="content-box">

        <p class="field-label">Personnel nécessaire :</p>
        <p class="field-value">...</p>

        <p class="field-label">But du P.I.N.S :</p>
        <p class="field-value">...</p>

        <p class="field-label">Ce qui faut faire :</p>
        <p class="field-value">...</p>

    </div>

    <a href="scp-keter.html" class="back">Retour aux SCP-Keter</a>
    <a href="index.html" class="back">Retour à l'accueil</a>

</body>
</html>
