<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCP-SAFE - Dossiers SCP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 80, 20, 0.45),
                    #020606 70%
                );
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 15px;
            color: white;
            text-shadow: 0 0 15px #7cff00;
        }

        .subtitle {
            font-size: 20px;
            color: #baff80;
            margin-bottom: 45px;
        }

        .scp-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 1000px;
            margin: auto;
        }

        .scp-card {
            display: block;
            padding: 35px 25px;
            border: 2px solid #7cff00;
            border-radius: 15px;
            background: rgba(0, 30, 10, 0.8);
            color: white;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 0 12px rgba(124, 255, 0, 0.25);
        }

        .scp-card:hover {
            transform: translateY(-8px);
            background: rgba(40, 90, 10, 0.9);
            box-shadow: 0 0 25px rgba(124, 255, 0, 0.7);
        }

        .scp-card h2 {
            color: #8cff00;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .scp-card p {
            font-size: 17px;
            color: #eeeeee;
        }

        .back {
            display: inline-block;
            margin-top: 45px;
            padding: 15px 28px;
            border-radius: 8px;
            background: #7cff00;
            color: black;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back:hover {
            background: #b5ff66;
            transform: scale(1.05);
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 38px;
            }

            .scp-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>SCP-SAFE</h1>

    <p class="subtitle">
        Accès aux dossiers des objets et anomalies SCP
    </p>

    <div class="scp-container">

        <!-- SCP-024-FR -->
        <a href="scp-024-fr.html" class="scp-card">
            <h2>SCP-024-FR</h2>
            <p>Accéder au dossier SCP-024-FR</p>
        </a>

        <!-- SCP-038 -->
        <a href="scp-038.html" class="scp-card">
            <h2>SCP-038</h2>
            <p>Accéder au dossier SCP-038</p>
        </a>

        <!-- SCP-524 -->
        <a href="scp-524.html" class="scp-card">
            <h2>SCP-524</h2>
            <p>Accéder au dossier SCP-524</p>
        </a>

        <!-- SCP-914 -->
        <a href="scp-914.html" class="scp-card">
            <h2>SCP-914</h2>
            <p>Accéder au dossier SCP-914</p>
        </a>

    </div>

    <a href="index.html" class="back">
        Retour à l’accueil
    </a>

</body>
</html>
